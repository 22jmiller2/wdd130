<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact US White Water Warriors</title>
    <meta name="description"
      content="The white water warriors contact us page. This will allow you to get in touch with us.">
    <meta name="author" content="Jacob Miller">

</head>

<body>

    <header>

        <img src="images/rafting-logo.jpg" alt="Logo">

        <nav>
            <ul>

                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact</a></li>

            </ul>

        </nav>

    </header>

    <main>
        <section class="contact-info">
            <h1 class="opaque">White Water Warriors</h1>
            <address>
                123 Main River Street<br>
                Kolob, California<br>
                <a href="tel:+19999999999">999-999-9999</a><br>
                <a href="mailto:info@whitewaterrafting.com">info@whitewaterrafting.com</a>
            </address>

        </section>

        <div class="contact-page">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d11515.979930297131!2d-111.78816816869724!3d43.81446347979847!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x53540b03dc48a5cf%3A0x1e5534d3c38ef412!2sBrigham%20Young%20University-Idaho!5e0!3m2!1sen!2sus!4v1770922009169!5m2!1sen!2sus"
              width="400" height="300" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade" class="gmap"></iframe>

            <form action="#" class="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required placeholder="Your Full Name">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="Your Email">
                <div class="purpose">
                    <p>Message Purpose:</p>
                    <fieldset>

                        <input type="radio" id="inquiry" name="purpose" value="inquiry" required>
                        <label for="inquiry">General Inquiry:</label>
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>
                        <input type="radio" id="feedback" name="purpose" value="feedback">
                        <label for="feedback">Feedback:</label>

                    </fieldset>
                </div>

                <div class="full-w">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" required
                      placeholder="Your Message"></textarea>
                </div>
                <div class="subscribe">
                    <input type="checkbox" id="subscribe" name="subscribe" value="yes">
                    <label for="subscribe">Subscribe to our newsletter</label>
                </div>
                <button type="submit" class="buttn buttn-submit">Get In Touch</button>


            </form>
        </div>

        <section class="employees">
            <h2>Meet Our team</h2>
            <figure class="employee">
                <img src="images/employee1.jpg" alt="Jane Doe">
                <figcaption>Jane Doe - Guide</figcaption>
            </figure>
            <figure class="employee">
                <img src="images/employee2.jpg" alt="John Smith">
                <figcaption>John Smith - Safety Officer</figcaption>
            </figure>
            <figure class="employee">
                <img src="images/employee3.jpg" alt="Smith John">
                <figcaption>Smith John - Mascot</figcaption>
            </figure>
        </section>


    </main>

    <footer>

        <p>©2026 White Water Warriors Jacob Miller</p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook-logo.svg" alt="Facebook Logo">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin-logo.svg" alt="LinkedIn Logo">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram-logo.svg" alt="Instagram Logo">
            </a>

        </nav>

    </footer>

</body>

</html>
